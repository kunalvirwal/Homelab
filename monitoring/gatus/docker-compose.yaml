version: "1"

services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    ports:
      - "7070:8080"
    volumes:
      - ./config.yaml:/config/config.yaml
      - ./data:/data
    environment:
      # Enable config watching (auto-reload)
      - GATUS_CONFIG_WATCHER=true

      ## For displaying DEBUG logs
      # - GATUS_LOG_LEVEL=DEBUG
